name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Bu ayar, GitHub paneli üzerinden manuel olarak APK üretimini tetiklemeye yarar

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Setup Java JDK (Android için)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sync Capacitor (Web kodlarını Android'e kopyalar)
        run: npx cap sync android

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ges-saha-takip-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Push APK to builds branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin builds || echo "Branch not found"
          git checkout builds || git checkout -b builds
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/SahaTakip-Guncel.apk
          git add release/SahaTakip-Guncel.apk
          git commit -m "Auto-update APK" || echo "No changes"
          git push origin builds --force
