name: Build Windows App

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build React and Electron
      run: npm run build:electron
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: ges-saha-takip-exe
        path: dist-electron/*.exe

    - name: Push EXE to builds branch
      shell: bash
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git fetch origin builds || echo "Branch not found"
        git checkout builds || git checkout -b builds
        mkdir -p release
        cp dist-electron/*.exe release/SahaTakip-Masaustu-Guncel.exe || echo "Copy failed"
        git add release/SahaTakip-Masaustu-Guncel.exe || echo "Nothing to add"
        git commit -m "Auto-update EXE" || echo "No changes"
        git push origin builds --force
