name: Build Windows App

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build React and Electron
      run: npm run build:electron
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: ges-saha-takip-exe
        path: dist-electron/*.exe

    - name: Debug and Push
      shell: bash
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git fetch origin builds || echo "Branch not found"
        git checkout builds || git checkout -b builds
        mkdir -p release
        
        # Log directory contents
        echo "=== dist-electron contents ===" > release/debug.txt
        ls -la dist-electron >> release/debug.txt
        echo "=== win-unpacked contents ===" >> release/debug.txt
        ls -la dist-electron/win-unpacked >> release/debug.txt
        
        # Try copy
        echo "=== copy ===" >> release/debug.txt
        node -e "const fs = require('fs'); const files = fs.readdirSync('dist-electron'); const exe = files.find(f => f.endsWith('.exe') && !f.includes('uninstaller')); if(exe) { fs.copyFileSync('dist-electron/' + exe, 'release/SahaTakip-Masaustu-Guncel.exe'); console.log('Copied ' + exe); } else { console.log('No EXE found'); }" >> release/debug.txt 2>&1
        
        git add release/
        git commit -m "Auto-update EXE with debug" || echo "No changes"
        git push origin builds --force