name: Build Windows App

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build React and Electron
      run: npm run build:electron
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        
    - name: Upload to GitHub Releases
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Rename the installer for a consistent download link
        for f in dist-electron/*Setup*.exe; do
           mv "$f" "SahaTakip-Masaustu-Guncel.exe"
        done
        
        # Create or update the 'latest-win' tag
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git tag -f latest-win
        git push origin latest-win --force
        
        # Create release if it doesn't exist
        gh release create latest-win --title "Masaüstü Sürümü" --notes "Windows EXE" || echo "Release already exists"
        
        # Upload the new EXE, overwriting the old one
        gh release upload latest-win SahaTakip-Masaustu-Guncel.exe --clobber